<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circabox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #AB7683;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 7rem);
      font-weight: 400;
      color: #F0E4DC;
      letter-spacing: 0.1em;
    }

    p {
      margin-top: 1rem;
      font-size: clamp(0.75rem, 2vw, 1rem);
      color: #F0E4DC;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>circabox</h1>
    <p>coming soon</p>
  </div>
</body>
</html>
